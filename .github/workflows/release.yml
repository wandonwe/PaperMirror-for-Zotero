name: Release

# VS Code-only workflow: no manual tags, no terminal.
#
# To ship a new version: bump the version in manifest.json (and package.json),
# update CHANGELOG.md, commit, and press Sync in VS Code. That push to main is
# the trigger — this job reads the version from manifest.json and, if no release
# exists for it yet, builds, creates the tag v<version>, and publishes the XPI
# and updates.json as release assets. Pushes that don't touch manifest.json are
# ignored; a version that's already released is skipped, so it never
# double-publishes.
#
# Nothing here writes to main (updates.json ships as a release asset, read via
# the latest-release alias in the plugin manifest), so main never diverges and
# VS Code's Sync stays a clean fast-forward forever.

on:
  push:
    branches: [main]
    paths:
      - manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Has this version already been released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: '20'
          cache: npm

      - name: Versions in manifest.json and package.json must match
        if: steps.check.outputs.exists == 'false'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          MAN="${{ steps.v.outputs.version }}"
          if [ "$PKG" != "$MAN" ]; then
            echo "package.json ($PKG) does not match manifest.json ($MAN) — bump both." >&2
            exit 1
          fi

      - name: Build, test, package
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          npm test
          npm run package

      - name: Generate updates.json
        if: steps.check.outputs.exists == 'false'
        run: node scripts/gen-updates.mjs "${{ steps.v.outputs.version }}"

      # The release body is this version's own CHANGELOG section — real,
      # human-written notes — with the auto-generated commit list appended.
      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        run: node scripts/release-notes.mjs "${{ steps.v.outputs.version }}"

      - name: Publish release (creates the tag)
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            dist/*.xpi
            updates.json
          generate_release_notes: true
