name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xpi
          generate_release_notes: true

      # Point the auto-update manifest at the just-published XPI. Zotero polls
      # updates.json on main; committing it here is what makes installed copies
      # upgrade themselves to this release.
      - name: Update updates.json on main
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          XPI="dist/zotero-bilingual-reader-${VERSION}.xpi"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          node scripts/gen-updates.mjs "$XPI"
          if git diff --quiet updates.json; then
            echo "updates.json already current"
          else
            git add updates.json
            git commit -m "chore(release): point updates.json at v${VERSION}"
            git push origin main
          fi
