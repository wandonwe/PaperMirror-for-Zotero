name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # Build the auto-update manifest for THIS release and ship it as a release
      # asset. The plugin's update_url is the latest-release alias
      # (releases/latest/download/updates.json), so uploading it here is all it
      # takes for installed copies to see the new version — nothing is ever
      # committed to main, so branch protection and concurrent tag builds can no
      # longer stall auto-update. The version comes from the tag, not
      # package.json, so a stray checkout can't change it.
      - name: Generate updates.json
        run: node scripts/gen-updates.mjs "${GITHUB_REF_NAME#v}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.xpi
            updates.json
          generate_release_notes: true
