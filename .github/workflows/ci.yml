name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Package XPI
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi
          if-no-files-found: error
