<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- PaperMirror brand mark — matches demo/styles.css .brand-mark
       (rounded square, linear-gradient(145deg,#377df1,#2355ad), white serif P) -->
  <defs>
    <linearGradient id="pmBrand" x1="0" y1="0" x2="0.79" y2="1.19">
      <stop offset="0" stop-color="#377df1"/>
      <stop offset="1" stop-color="#2355ad"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="35" fill="url(#pmBrand)"/>
  <text x="64" y="64" fill="#ffffff"
        font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700"
        text-anchor="middle" dominant-baseline="central">P</text>
</svg>
